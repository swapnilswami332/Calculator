<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusCalc — Premium Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">NexusCalc</span>
      </div>
      <div class="topbar-actions">
        <span class="angle-badge" id="angle-badge" hidden>DEG</span>
        <label class="sound-toggle" title="Key click sound">
          <input type="checkbox" id="sound-toggle" />
          <span>Sound</span>
        </label>
        <button type="button" id="mode-toggle" class="btn-mode">Advanced Mode</button>
      </div>
    </header>

    <div class="main-layout">
      <nav class="sidebar" aria-label="Tools">
        <button type="button" class="nav-item active" data-tool="basic" title="Basic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M12 10h2M16 10h0M8 14h2M12 14h2M16 14h0M8 18h8"/></svg>
          <span>Basic</span>
        </button>
        <button type="button" class="nav-item" data-tool="age" title="Age">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20c0-4 2.7-6 6-6s6 2 6 6"/></svg>
          <span>Age</span>
        </button>
        <button type="button" class="nav-item" data-tool="currency" title="Currency">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M9 9h4.5a1.5 1.5 0 010 3H9M15 15H10.5a1.5 1.5 0 000 3H15"/></svg>
          <span>FX</span>
        </button>
        <button type="button" class="nav-item" data-tool="interest" title="Interest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 17V11M12 17V7M16 17v-4"/></svg>
          <span>Interest</span>
        </button>
        <button type="button" class="nav-item" data-tool="time" title="Time">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>Time</span>
        </button>
        <button type="button" class="nav-item" data-tool="date" title="Date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>Date</span>
        </button>
        <button type="button" class="nav-item eng-nav" data-tool="engineering" title="Engineering">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span>Eng</span>
        </button>
      </nav>

      <main class="workspace">
        <div id="tool-panel" class="tool-panel"></div>
      </main>
    </div>
  </div>

  <div id="loader-overlay" class="loader-overlay" hidden>
    <div class="spinner"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
